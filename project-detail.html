<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script defer src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <title class="title-detail"></title>
    <link rel="icon" type="image/png" href="asset/tab-icon.png">

    <!-- Lato Font (Body) --> 
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');
    </style>
    <!-- Fairplay Display Font (Headline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <header>
        <a href="index.html#">
            <img src="asset/web-icon.png" width="96px" class="hover:border-b-[2px] hover:pb-[4px]">
        </a>

        <nav>
            <label for="menu-toggle" class="block cursor-pointer md:hidden">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </label>

            <input type="checkbox" id="menu-toggle" class="hidden peer">

            <ul class="hidden peer-checked:flex flex-col items-center justify-center absolute top-full left-0 w-full bg-white/90 dark:bg-black/90 backdrop-blur-md p-10 gap-6 shadow-xl md:flex md:flex-row md:static md:w-auto md:p-0 md:gap-6 md:shadow-none md:bg-transparent md:dark:bg-transparent md:backdrop-blur-none">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#experience">Experience</a></li>
                <li><a href="index.html#activity">Activity</a></li>
                <li><a href="index.html#project">Project</a></li>
                <li><a href="index.html#education">Education</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="px-6 pb-20 md:px-20">
        <ul class="flex flex-row gap-2 items-center justify-start mt-[8px]">
            <li class="hover:font-bold"><a href="index.html">Home</a></li>
            <li>/</li>
            <li class="hover:font-bold"><a href="index.html#project">Project</a></li>
            <li>/</li>
            <li><b><a href="#" class="title-detail"></a></b></li>
        </ul>

        <h1 class="title-detail mt-[40px]" style="font-size: 28px; font-weight: bold; font-family: var(--font-playfair);"></h1>

        <img id="project-logo" class="rounded-[8px] w-full h-[160px] md:h-[400px] object-cover mt-[20px]">

        <div class="flex flex-col gap-[8px] md:flex-row md:items-start md:justify-between mt-[20px]">
            <table class="rounded-[8px] border border-separate border-spacing-0 overflow-hidden" style="border: 2px solid var(--color-primary)">
                <tr>
                    <td class="px-4 py-2 text-start" style="background-color: var(--color-primary); color: var(--color-on-primary); font-weight: bold;">Role</td>
                    <td id="my-role" class="px-4 py-2 text-start" style="background-color: var(--container-bg-color); border-bottom: 2px solid var(--color-primary);"></td>
                </tr>
                <tr>
                    <td class="px-4 py-2 text-start" style="background-color: var(--color-primary); color: var(--color-on-primary); font-weight: bold;">Tech Stacks</td>
                    <td id="my-stack" class="px-4 py-2 text-start" style="background-color: var(--container-bg-color);"></td>
                </tr>
            </table>

            <div id="project-duration" class="px-4 py-2 rounded-[8px] text-center" style="background-color: var(--color-primary); color: var(--color-on-primary);"></div>
        </div>

        <p id="project-desc" class="mt-[32px] text-justify">tes</p>

        <h2 id="title-project-img" style="font-size: 20px; text-align: center; font-weight: bold; margin-top: 40px;"
        >Project Result</h2>
        <div id="project-img" class="flex flex-col items-center mt-[12px]">
            <div id="carousel-img" class="carousel max-w-[1000px] max-h-[500px]"></div>
            <div id="carousel-nav" class="flex w-full justify-center gap-2 py-2"></div>
        </div>

        <h2 id="title-project-demo" style="font-size: 20px; text-align: center; font-weight: bold; margin-top: 40px;">Demo</h2>
        <div id="project-demo" class="w-full max-w-[800px] aspect-video mx-auto mt-[12px]"></div>
    </main>

    <footer>
        <!-- TODO: Bikin kayak kartu nama, jadi lbh ada kesan di footer -->
        <p>&copy; <span id="year"></span> Carissa Chandra. All rights are reserved.</p>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
